<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Convite Thays e Frederico</title>
<style>
    body {
        margin: 0;
        padding: 0;
        text-align: center;
        background: #ffffff;
        font-family: Arial, sans-serif;
    }

    img {
        width: 100%;
        max-width: 500px; /* ajuste para celular */
        height: auto;
        display: block;
        margin: 0 auto;
    }

    .container {
        position: relative;
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
    }

    /* Áreas clicáveis responsivas */
    .link-area {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 70%;
        height: 42px; /* altura do botão */
    }

    /* Aqui você ajusta a posição vertical (top) de cada botão */
    #btn-localizacao { top: 890px; }
    #btn-confirmar   { top: 945px; }
    #btn-presentes   { top: 1000px; }
    #btn-site        { top: 1055px; }

</style>
</head>

<body>

<div class="container">
    <img src="convite.png">

    <a id="btn-localizacao" class="link-area"
       href="https://maps.app.goo.gl/CcJAqpVvp9umBRKN7?g_st=ipc"
       target="_blank"></a>

    <a id="btn-confirmar" class="link-area"
       href="https://noivos.casar.com/thays-e-frederico#/rsvp"
       target="_blank"></a>

    <a id="btn-presentes" class="link-area"
       href="https://noivos.casar.com/thays-e-frederico#/presentes"
       target="_blank"></a>

    <a id="btn-site" class="link-area"
       href="https://noivos.casar.com/thays-e-frederico#/home"
       target="_blank"></a>
</div>

</body>
</html>
